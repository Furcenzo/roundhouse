# Settings of this app for the mac-app-kit scripts in scripts/ (zsh syntax; defaults in scripts/app-config.sh).
APP_NAME="Roundhouse"                  # name of the .app
EXECUTABLE="Roundhouse"              # Swift executable target, Sources/Roundhouse
BUNDLE_ID="io.github.furcenzo.roundhouse"
GITHUB_REPO="Furcenzo/roundhouse"
CASK="roundhouse"                          # Casks/roundhouse.rb in Furcenzo/homebrew-tap (add the cask before the first release)
SITE_SLUG=""                             # name for dev.furian.sk's update-site.sh, once the site shows the app
CATEGORY="public.app-category.utilities"
MIN_MACOS="15.0"
AGENT_APP=1                              # 1 = menu bar only, no Dock icon
DEV_CHANNEL=1                            # development builds are "Roundhouse Dev" (io.github.furcenzo.roundhouse.dev)
